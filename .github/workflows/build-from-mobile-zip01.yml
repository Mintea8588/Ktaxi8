name: Build APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'KoreaTaxiMeter-MobileUpload-v1.5.1.zip'
      - '.github/workflows/build-from-mobile-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          rm -rf /tmp/taximeter
          mkdir -p /tmp/taximeter
          unzip -q KoreaTaxiMeter-MobileUpload-v1.5.1.zip -d /tmp/taximeter
          cp -a /tmp/taximeter/. ./
          rm -f KoreaTaxiMeter-MobileUpload-v1.5.1.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KoreaTaxiMeter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
